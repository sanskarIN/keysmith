name: Generate dependency lockfiles

on:
  push:
    branches: [chore/final-verification]

permissions:
  contents: write

concurrency:
  group: keysmith-lockfiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate npm lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Generate Cargo lockfile
        run: cargo generate-lockfile
      - name: Commit lockfiles when changed
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add Cargo.lock package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git commit -m "build: commit reproducible dependency lockfiles"
          git push origin HEAD:chore/final-verification
