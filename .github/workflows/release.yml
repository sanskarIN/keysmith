name: Release build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Require committed dependency lockfiles
        run: |
          test -f package-lock.json
          test -f Cargo.lock
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Require tag to match package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const p = require('./package.json'); if (process.env.RELEASE_TAG !== 'v' + p.version) { console.error('Tag must equal v' + p.version); process.exit(1); }"
      - run: npm audit --audit-level=high
      - run: npm run secret:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run docs:check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p keysmith-core --all-targets --all-features -- -D warnings
      - run: cargo test --locked -p keysmith-core --all-features
      - run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - uses: EmbarkStudios/cargo-deny-action@v2

  build:
    needs: verify-tag
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "KeySmith ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for release notes. Generated artifacts are unsigned unless signing is configured in protected secrets."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
